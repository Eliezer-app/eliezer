name: eliezer

services:
  init:
    image: node:22-slim
    working_dir: /opt/eliezer
    volumes:
      - .:/opt/eliezer
      - node_modules:/opt/eliezer/node_modules
    command: npm ci

  eliezer:
    image: node:22-slim
    container_name: eliezer
    working_dir: /opt/eliezer
    ports:
      - "3200:3200"
    volumes:
      - .:/opt/eliezer
      - ../clawchat:/opt/clawchat
      - ..:/home/projects
      - node_modules:/opt/eliezer/node_modules
    command: sh -c 'npx tsx eliezer.mts 2>&1 | stdbuf -oL tee -a /opt/eliezer/state/eliezer.log'
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
    depends_on:
      init:
        condition: service_completed_successfully

  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    volumes:
      - ./config/searxng:/etc/searxng

volumes:
  node_modules:
