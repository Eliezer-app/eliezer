name: eliezer

services:
  init:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm ci

  eliezer:
    image: node:22-slim
    container_name: eliezer
    working_dir: /app
    ports:
      - "3200:3200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npx tsx eliezer.mts
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  node_modules:
