name: eliezer

services:
  init:
    image: node:22-slim
    working_dir: /opt/eliezer
    volumes:
      - .:/opt/eliezer
      - node_modules:/opt/eliezer/node_modules
    command: npm ci

  eliezer:
    image: node:22-slim
    container_name: eliezer
    working_dir: /opt/eliezer
    ports:
      - "3200:3200"
    volumes:
      - .:/opt/eliezer
      - ../clawchat:/opt/clawchat
      - node_modules:/opt/eliezer/node_modules
    command: sh -c 'apt-get update -qq && apt-get install -y -qq libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxshmfence1 libnss3 libnspr4 >/dev/null 2>&1 && npx tsx eliezer.mts 2>&1 | stdbuf -oL tee -a /opt/eliezer/state/eliezer.log'
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
    depends_on:
      init:
        condition: service_completed_successfully

  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    volumes:
      - ./config/searxng:/etc/searxng

volumes:
  node_modules:
