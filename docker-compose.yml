services:
  eliezer:
    build: .
    image: eliezer:latest
    container_name: eliezer
    ports:
      - "8888:8888"
    volumes:
      - ./mount:/opt/eliezer
      - ./logs:/var/log/eliezer
      - node_modules:/opt/eliezer/node_modules
    command: bash -c "npm ci && npx tsx eliezer.mts 2>&1"

volumes:
  node_modules:
