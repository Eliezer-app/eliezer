use_default_settings: true

search:
  formats:
    - json
    - html

server:
  secret_key: "change-me-in-production"
  bind_address: "0.0.0.0"
  port: 8080

engines:
  - name: google
    engine: google
    shortcut: g

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: bing
    engine: bing
    shortcut: b

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
